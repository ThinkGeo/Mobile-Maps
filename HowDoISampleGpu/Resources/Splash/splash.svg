<!--
  The ThinkGeo mark: an isometric field of map tiles with a pin standing on it.
  Redrawn as vectors from the 180x180 bitmap thinkgeo.com serves, which is the
  largest the brand publishes and far short of the 1024x1024 the App Store asks
  for. The two colours are sampled from that bitmap: #62B7E2 and #9E9E9C.

  The splash screen, where the mark sits small on the launch colour.
-->
