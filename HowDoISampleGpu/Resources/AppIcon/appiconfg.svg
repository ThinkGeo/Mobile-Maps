<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  The ThinkGeo mark: a pin standing on a field of map tiles.

  Traced, not redrawn. The only art the brand publishes is a 180x180 bitmap on
  thinkgeo.com, a sixth of the 1024x1024 the App Store wants, and the tiles in it
  are not a grid - they run 37x17 at the back to 76x36 at the front, in no
  progression, and the pin hides part of three of them. Anything reconstructed
  from a rule came out visibly wrong, so these outlines are the bitmap's own,
  followed and then fitted with straight lines; the pin and its dot are the one
  curved part and are drawn as geometry (circle at 89.6,51 r23, ring to r16.8,
  the sides tangent and meeting at y98) because a traced circle is a polygon and
  shows its facets at 1024px. Against the source it differs on 1.2% of pixels,
  all of them one deep along an antialiased edge.

  Colours sampled from the same bitmap: #62B7E2 and #9E9E9C.

  The foreground of the app icon; appicon.svg is the plate behind it.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(29.70,28.60) scale(2.2156)">
    <path fill="#62B7E2" fill-rule="evenodd" d="M 119,105 L 100,97 L 100,95 L 96,93 L 105,77 L 144,94 L 143,96 L 122,106 Z"/>
    <path fill="#62B7E2" fill-rule="evenodd" d="M 78,84 L 79,87 L 67,82 L 66,80 L 74,77 Z"/>
    <path fill="#9E9E9C" fill-rule="evenodd" d="M 67,103 L 63,106 L 56,107 L 35,97 L 34,95 L 62,83 L 82,93 L 79,95 L 78,99 Z"/>
    <path fill="#62B7E2" fill-rule="evenodd" d="M 20,113 L 15,116 L 10,116 L 1,110 L 27,98 L 39,103 L 38,105 Z"/>
    <path fill="#9E9E9C" fill-rule="evenodd" d="M 126,108 L 148,98 L 152,98 L 178,111 L 145,127 L 142,127 L 116,115 L 116,113 Z"/>
    <path fill="#62B7E2" fill-rule="evenodd" d="M 100,101 L 114,107 L 115,109 L 90,121 L 86,121 L 65,111 L 66,109 L 81,102 L 90,103 Z"/>
    <path fill="#9E9E9C" fill-rule="evenodd" d="M 57,112 L 81,122 L 82,124 L 54,136 L 19,120 L 20,118 L 44,107 L 48,107 Z"/>
    <path fill="#62B7E2" fill-rule="evenodd" d="M 96,122 L 110,116 L 138,130 L 91,152 L 62,140 L 62,138 Z"/>
    <path fill="#FFFFFF" d="M 74.862,59.064 L 89.600,86.000 L 104.338,59.064 A 16.8 16.8 0 1 0 74.862,59.064 Z"/>
    <path fill="#62B7E2" fill-rule="evenodd" d="M 69.542,62.255 L 89.600,98.000 L 109.658,62.255 A 23.0 23.0 0 1 0 69.542,62.255 Z M 74.862,59.064 L 89.600,86.000 L 104.338,59.064 A 16.8 16.8 0 1 0 74.862,59.064 Z"/>
    <circle cx="89.6" cy="51.0" r="10.0" fill="#9E9E9C"/>
  </g>
</svg>
